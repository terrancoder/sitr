# Reproducibility and hygiene. Version identity is static (no git-derived
# values at build time); see docs/mobile.md §Verifiability.
org.gradle.jvmargs=-Xmx2g
# The build cache stays off. It hands back whatever an earlier build stored,
# and an incremental Kotlin compile can store code that differs from a clean
# compile (0.1.1: one Compose file, so the APK hash differed between
# machines). A release is built with `./gradlew clean` first for the same
# reason.
org.gradle.caching=false
kotlin.code.style=official
android.useAndroidX=true
