<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      width: 440px; height: 280px; overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #0d3b1e 0%, #1a7f37 100%);
      color: #fff; display: flex; flex-direction: column;
      justify-content: center; padding: 0 32px; gap: 10px;
    }
    .row { display: flex; align-items: center; gap: 14px; }
    img { width: 56px; height: 56px; filter: brightness(0) invert(1); }
    h1 { font-size: 40px; font-weight: 650; letter-spacing: 0.5px; }
    .ar { font-size: 20px; opacity: 0.85; font-weight: 400; margin-left: 6px; }
    p { font-size: 16.5px; line-height: 1.45; opacity: 0.95; }
    .sub { font-size: 13px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="row">
    <img src="../../extension/public/icon128.png" alt="" />
    <h1>Sitr <span class="ar">سِتْر</span></h1>
  </div>
  <p>Halal &amp; family content filter.<br />On your device — never on our servers.</p>
  <p class="sub">Open source · No analytics · Public blocklist</p>
</body>
</html>
